<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincode Hub.in</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1b4b; color: #fff; padding: 20px; text-align: center; }
        .box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #ec4899; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .res { margin-top: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Pincode Hub.in 👳‍♂️📍</h2>
        <p id="liveDateTime">సమయం లోಡ್ అవుతోంది...</p>
        <hr style="margin: 15px 0; border: 0.5px solid rgba(255,255,255,0.2);">
        
        <input type="text" id="pincodeInput" placeholder="పిన్‌కోడ్ లేదా ప్రాంతం టైప్ చేయండి...">
        <button onclick="searchPin()">వెతకండి / Search</button>
        
        <div id="output" class="res">ఫలితాలు ఇక్కడ కనిపిస్తాయి...</div>
    </div>

    <script>
        function updateTime() {
            document.getElementById('liveDateTime').innerText = new Date().toLocaleString('en-IN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function searchPin() {
            const val = document.getElementById('pincodeInput').value.trim();
            const out = document.getElementById('output');
            if(!val) { alert('దయచేసి టైప్ చేయండి!'); return; }
            out.innerHTML = "వెతుకుతోంది...";
            try {
                let url = /^\d{6}$/.test(val) ? `https://api.postalpincode.in/pincode/${val}` : `https://api.postalpincode.in/postoffice/${encodeURIComponent(val)}`;
                let res = await fetch(url);
                let data = await res.json();
                if(data && data[0].Status === 'Success') {
                    let html = "";
                    data[0].PostOffice.forEach(p => {
                        html += `<p><b>${p.Name}</b> - ${p.Pincode}<br><small>${p.District}, ${p.State}</small></p><hr style="border:0.2px solid #444">`;
                    });
                    out.innerHTML = html;
                } else {
                    out.innerHTML = "సమాచారం లభించలేదు.";
                }
            } catch(e) {
                out.innerHTML = "సర్వర్ లోపం.";
            }
        }
    </script>
</body>
</html>
